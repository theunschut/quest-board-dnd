name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.tag.outputs.version }}

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway password for an ephemeral container that only lives for this job.
          MSSQL_SA_PASSWORD: "QuestBoard-CI-only-9"
        ports:
          - 1433:1433

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: build/validate-release-tag.sh >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: dotnet build -c Release -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      - name: Test
        env:
          QUESTBOARD_MIGRATOR_TEST_CONNECTION: "Server=127.0.0.1,1433;User Id=sa;Password=QuestBoard-CI-only-9;TrustServerCertificate=true;Encrypt=false"
          QUESTBOARD_MIGRATOR_TEST_REQUIRED: "1"
        run: dotnet test -c Release --no-build

      - name: Script tests
        run: |
          set -euo pipefail
          bash deploy/tests/run-all.sh
          bash build/tests/validate-release-tag-test.sh
          bash build/tests/release-workflow-test.sh

      - name: Package release
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: build/package-release.sh --version "$VERSION" --commit "$GITHUB_SHA" --output artifacts/release --no-build

      - name: Check packaged release
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          bash build/tests/package-release-smoke-test.sh "artifacts/release/questboard-v$VERSION.zip"
          QUESTBOARD_TEST_PACKAGED_ZIP="artifacts/release/questboard-v$VERSION.zip" bash deploy/tests/install-flow-test.sh

      - name: Network verification test
        run: QUESTBOARD_TEST_NETWORK=1 bash deploy/tests/verify-rejects-tampered-artifact-network-test.sh

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/release/questboard-v${{ steps.tag.outputs.version }}.zip

      - name: Save attestation bundle for offline verification
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: cp "$BUNDLE_PATH" "artifacts/release/questboard-v$VERSION.zip.sigstore.json"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          zip_asset="artifacts/release/questboard-v$VERSION.zip"
          checksum_asset="artifacts/release/questboard-v$VERSION.zip.sha256"
          bundle_asset="artifacts/release/questboard-v$VERSION.zip.sigstore.json"

          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" = "true" ]; then
              gh release upload "$TAG" "$zip_asset" "$checksum_asset" "$bundle_asset" --clobber
            else
              echo "::error::Release $TAG already exists and is published; refusing to overwrite it" >&2
              exit 1
            fi
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --notes "Draft created by the release workflow. Write the release title and notes, then approve the deploy environment to publish this release." \
              "$zip_asset" "$checksum_asset" "$bundle_asset"
          fi

  publish:
    needs: build
    environment: deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release --clobber

      - name: Verify release checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c "questboard-$TAG.zip.sha256"

      - name: Re-verify build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh attestation verify "release/questboard-$TAG.zip" \
            --bundle "release/questboard-$TAG.zip.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG" \
            --deny-self-hosted-runners

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
